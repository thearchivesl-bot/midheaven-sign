<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign</title>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 1024px;
      height: 1024px;
      overflow: hidden;
      background: transparent;
    }

    .sign {
      width: 512px;
      height: 512px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 40px;
      position: relative;
    }



    .text-content {
      font-family: 'Permanent Marker', cursive;
      font-size: 72px;
      color: #111111;
      text-align: center;
      line-height: 1.05;
      letter-spacing: -0.5px;
      text-transform: uppercase;
      word-break: break-word;
      position: relative;
      z-index: 1;

      /* Slight marker bleed effect */
      text-shadow:
        1px 1px 0px rgba(0,0,0,0.08),
        -0.5px 0.5px 0px rgba(0,0,0,0.05);
    }
  </style>
</head>
<body>
  <div class="sign">
    <div class="text-content" id="signText">MIDHEAVEN</div>
  </div>

  <script>
    function getParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    function fitText(el) {
      const container = el.parentElement;
      const maxW = container.clientWidth - 80;
      const maxH = container.clientHeight - 80;
      let size = 80;

      el.style.fontSize = size + 'px';

      while ((el.scrollWidth > maxW || el.scrollHeight > maxH) && size > 14) {
        size -= 2;
        el.style.fontSize = size + 'px';
      }
    }

    window.addEventListener('load', () => {
      const raw = getParam('text');
      const el = document.getElementById('signText');

      if (raw) {
        // Decode and clean input
        const decoded = decodeURIComponent(raw).toUpperCase().trim();
        el.textContent = decoded;
      }

      fitText(el);
    });
  </script>
</body>
</html>
